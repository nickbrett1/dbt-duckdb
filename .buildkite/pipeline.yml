# Ported from CircleCI's `download_transform_load` workflow: three steps, main
# only, with the transform depending on both downloads.
#
# Two deliberate changes from the CircleCI jobs:
#   * secrets are injected with `doppler run` at runtime (the repository's own
#     npm scripts already work that way), replacing CircleCI's "context: common";
#   * the toolchain install (rclone, sqlite3, jq, node, Doppler CLI, pip deps)
#     lives in scripts/setup-toolchain.sh, because all three jobs installed it
#     inline and identically.

x-common: &common
  agents:
    queue: mac-studio-linux
  plugins:
    - docker#v5.13.0:
        image: "python:3.13-bookworm"
        platform: linux/arm64
        workdir: /workdir
        environment:
          - DOPPLER_TOKEN

# rclone.conf sets env_auth = true, so rclone reads S3-compatible credentials
# from the environment. This is Cloudflare R2, not AWS, so the pair lives in
# Doppler under this repository's own names. Checked first, so a missing variable
# fails in seconds rather than after the toolchain install.
x-r2-credentials: &r2-credentials |
  # The Doppler CLI is what reads the credentials below, so install just it
  # first: a missing variable then fails in seconds rather than after the whole
  # toolchain. setup-toolchain.sh installs the rest (and skips this step).
  if ! command -v doppler >/dev/null 2>&1; then
    apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
    curl -Ls --tlsv1.2 --proto "=https" --retry 3 https://cli.doppler.com/install.sh | sh
  fi
  export AWS_ACCESS_KEY_ID="$$(doppler secrets get CLOUDFLARE_R2_ACCESS_KEY_ID --project common --config dev --plain)"
  export AWS_SECRET_ACCESS_KEY="$$(doppler secrets get CLOUDFLARE_R2_SECRET_ACCESS_KEY --project common --config dev --plain)"
  if [ -z "$$AWS_ACCESS_KEY_ID" ] || [ -z "$$AWS_SECRET_ACCESS_KEY" ]; then
    echo "R2 credentials missing: expected CLOUDFLARE_R2_ACCESS_KEY_ID and CLOUDFLARE_R2_SECRET_ACCESS_KEY in Doppler common/dev." >&2
    exit 1
  fi

steps:
  - label: ":arrow_down: Download population data"
    key: download_population
    if: build.branch == "main"
    <<: *common
    commands:
      - *r2-credentials
      - bash .buildkite/scripts/setup-toolchain.sh
      - doppler run --project common --config dev -- python download_population.py

  - label: ":arrow_down: Download WDI data"
    key: download_wdi
    if: build.branch == "main"
    <<: *common
    commands:
      - *r2-credentials
      - bash .buildkite/scripts/setup-toolchain.sh
      - doppler run --project common --config dev -- python download_wdi.py

  - label: ":bar_chart: Transform and load"
    key: transform_and_load
    depends_on:
      - download_population
      - download_wdi
    if: build.branch == "main"
    <<: *common
    commands:
      - *r2-credentials
      - bash .buildkite/scripts/setup-toolchain.sh
      # Populate the DuckDB database from the downloaded sources.
      - doppler run --project common --config dev -- python populate.py --use-duckdb
      # Build and document the dbt models.
      - doppler run --project common --config dev -- bash -c 'cd wdi && dbt deps && dbt run --target prod && dbt docs generate --target prod'
      - doppler run --project common --config dev -- rclone copy wdi/target/manifest.json r2:wdi/docs --checksum
      - doppler run --project common --config dev -- rclone copy wdi/target/catalog.json r2:wdi/docs --checksum
      - doppler run --project common --config dev -- rclone copy wdi/target/index.html r2:wdi/docs --checksum
      # Export the marts as Parquet, sync what changed, then update D1.
      - doppler run --project common --config dev -- python export_parquet.py export
      - doppler run --project common --config dev -- python sync_remote_parquet.py export/exported_files.json changed_tables.json
      - |
        if [ -s changed_tables.json ]; then
          doppler run --project common --config dev -- python update_d1.py changed_tables.json --remote
        else
          echo "No changes detected; skipping D1 update."
        fi
